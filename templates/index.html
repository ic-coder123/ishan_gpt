{% extends "layout.html" %}
{% block content %}
<h1 style="text-align: center;">Ask IshanGPT a question</h1>

{% if formspree_form_id %}
<form method="post" action="https://formspree.io/f/{{ formspree_form_id }}" style="text-align: center;">
    <input type="text" name="question" placeholder="Enter your question" required style="width: 50%; padding: 10px;">
    <input type="email" name="email" placeholder="Enter your email" required style="width: 50%; padding: 10px;">
    <input type="hidden" name="_subject" value="New IshanGPT question">
    <div style="display: none;">
        <label>Leave this field empty<input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></label>
    </div>
    <button type="submit" style="padding: 10px 20px;">Ask</button>
</form>
{% else %}
<p style="text-align: center;">The question form is not configured yet.</p>
{% endif %}
{% endblock %}
